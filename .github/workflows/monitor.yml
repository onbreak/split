name: Hourly File Monitor

on:
  schedule:
    # Runs at minute 0 of every hour. 
    - cron: '0 * * * *' 
  workflow_dispatch: # Allows you to run it manually from a button

jobs:
  monitor_and_log:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to save the CSV back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitoring script
        run: python monitor.py

      - name: Save report to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 30_day_monitoring_report.csv
          # The '|| echo' prevents the workflow from failing if the file hasn't changed
          git commit -m "Automated log update" || echo "No changes to commit"
          git push
